name: Update known words and top mistakes

on:
  push:
    paths:
      - "sessions/**"
      - "scripts/update-known-words.js"
      - "scripts/top-mistakes.js"
      - "data/top-5000.txt"
      - "data/mistakes.jsonl"
      - "data/errors.json"
      - "data/pronunciation-scores.jsonl"
      - ".github/workflows/update-known-words.yml"
  schedule:
    # Once a day (UTC)
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lists:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rebuild known / unknown word lists
        run: node scripts/update-known-words.js

      - name: Rebuild top mistakes (90d)
        run: node scripts/top-mistakes.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/known-words.txt data/unknown-top-words.txt data/top-mistakes-90d.md
          if git diff --staged --quiet; then
            echo "No generated-list changes."
            exit 0
          fi
          git commit -m "chore: update known-words, unknown-top-words, top-mistakes"
          git push origin HEAD:main
